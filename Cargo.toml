[package]
name = "bulletproofs"
# Before doing a release:
# - update version field
# - update html_root_url
# - update CHANGELOG
version = "5.0.1"
authors = ["Cathie Yun <cathieyun@gmail.com>",
           "Henry de Valence <hdevalence@hdevalence.ca>",
           "Oleg Andreev <oleganza@gmail.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/zkcrypto/bulletproofs"
categories = ["cryptography"]
keywords = ["cryptography", "crypto", "ristretto", "zero-knowledge", "bulletproofs"]
description = "A pure-Rust implementation of Bulletproofs using Ristretto"
edition = "2018"

[dependencies]
curve25519-dalek = { version = "4.1.3", features = ["digest", "group", "rand_core", "serde"] }
group = { version = "0.13", default-features = false }
ff = { version = "0.13", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
k256 = { version = "0.13.4", default-features = false, features = ["arithmetic", "hash2curve", "expose-field", "alloc", "precomputed-tables", "serde", "std"] }
sha2 = { version = "0.10", default-features = false, features = ["compress"] }
# The Simplicity verifier generator (feature `simplicity`): parse, run and measure programs.
simplicity-lang = { version = "0.9.0", optional = true, features = ["elements", "human_encoding"] }
subtle = { version = "2.5", default-features = false }
# asm: Keccak with the ARMv8 SHA3 instructions when the CPU has them (runtime detection, same
# output); sha3 has the feature from 0.10.7, keccak's ARMv8 code is sound from 0.1.6
sha3 = { version = "0.10.7", default-features = false, features = ["asm"] }
keccak = "0.1.6"
digest = { version = "0.10", default-features = false }
rand_core = { version = "0.6", default-features = false, features = ["alloc"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
byteorder = { version = "1", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc"] }
serde_derive = { version = "1", default-features = false }
thiserror = "1"
merlin = { version = "3", default-features = false }
clear_on_drop = { version = "0.2", default-features = false }
rayon = { version = "1", optional = true }

[dev-dependencies]
hex = "0.3"
criterion = "0.3"
bincode = "1"
serde_json = "1"
rand_chacha = "0.3"
curve25519-dalek = { version = "4.1.3", features = ["digest", "group", "legacy_compatibility", "rand_core", "serde"] }

[features]
# Testing only: `r1cs::cheats::set_unchecked_prover` makes the prover skip its own checks
# (lookups equal to no row, unsatisfied BP++ circuits), so that downstream soundness tests can
# check that the verifier rejects the result. Never enable it in a prover that matters.
cheats = []
# Multi-threaded proving and verification (rayon): multiscalar multiplications, the
# inner-product folding and generator derivation. Results are identical to the serial code.
parallel = ["dep:rayon"]
# Experimental: compile R1CS circuits (BP++ backend, secp256k1, SHA-256 transcript) into Simplicity
# programs that verify their proofs (`bulletproofs::simplicity`, docs/simplicity-verifier.md).
simplicity = ["dep:simplicity-lang"]


[[test]]
name = "range_proof"

[[test]]
name = "r1cs"

[[test]]
name = "reciprocal"

[[test]]
name = "r1cs_bppp"

[[test]]
name = "builder"

[[example]]
name = "bppp_profile"

[[test]]
name = "bppp_malformed"

[[test]]
name = "bppp_batch"

[[test]]
name = "bppp_regression"

[[bench]]
name = "range_proof"
harness = false

[[bench]]
name = "generators"
harness = false

[[bench]]
name = "r1cs"
harness = false

[[bench]]
name = "linear_proof"
harness = false

[[bench]]
name = "bppp"
harness = false

[[bench]]
name = "curves"
harness = false

[[test]]
name = "facade"

[[example]]
name = "curves_table"

[[test]]
name = "elements"

[[example]]
name = "simplicity_costs"
required-features = ["simplicity"]
